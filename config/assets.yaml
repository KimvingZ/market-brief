# Market Brief: assets and data sources.
#
# Each asset lists price sources in order of preference. The data job uses the
# first one that returns fresh data, and keeps using it while it works, so an
# asset's history never mixes two exchanges.
#
# calendar: when a daily bar is complete
#   crypto     -> 00:00 UTC (Phnom Penh 07:00)
#   us_equity  -> 16:00 New York
#   cme        -> 17:00 New York (gold and oil futures)
#
# Horizons are counted in daily bars: crypto trades every day, the others on
# weekdays only.

display_timezone: Asia/Phnom_Penh

horizons:
  crypto:  {today: 1, short: 7, long: 30}
  default: {today: 1, short: 5, long: 21}

history:
  daily_years: 10      # base rates use up to this much daily history
  hourly_days: 365     # session statistics use up to this much hourly history

assets:
  # ---------------- crypto ----------------
  - id: BTC
    name: Bitcoin
    group: crypto
    calendar: crypto
    calls: true
    sources:
      - {provider: bitget_futures, symbol: BTCUSDT, label: "Bitget BTCUSDT perpetual"}
      - {provider: coinbase, symbol: BTC-USD, label: "Coinbase BTC-USD spot"}
      - {provider: hyperliquid, symbol: BTC, label: "Hyperliquid BTC perpetual"}
      - {provider: kraken, symbol: XBTUSD, label: "Kraken XBT/USD spot"}
    derivatives:
      - {provider: bitget_futures, symbol: BTCUSDT}
      - {provider: hyperliquid, symbol: BTC}

